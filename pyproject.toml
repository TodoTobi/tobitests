[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tobitests"
version = "1.0.0"
description = "Local-first autonomous multi-agent E2E QA and visual telemetry framework with native MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TodoTobi" }]
keywords = ["testing", "e2e", "playwright", "mcp", "qa", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
audit = ["playwright>=1.45"]
dev = ["pytest>=8.0"]

[project.scripts]
tobitests = "tobitests_cli:main"
tobitests-mcp = "tobitests_mcp:main"

[project.urls]
Homepage = "https://github.com/TodoTobi/tobitests"
Repository = "https://github.com/TodoTobi/tobitests"
Issues = "https://github.com/TodoTobi/tobitests/issues"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = [
    "tobitests_cli",
    "tobitests_mcp",
    "ingest_playwright_results",
    "run_deep_audit",
    "sync_specs",
]
