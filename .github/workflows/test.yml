name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install Python package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Python unit tests and CLI/MCP smoke checks
        run: |
          python -m pytest -q
          tobitests --help
          tobitests-mcp --help

      - name: Install Node dependencies
        run: npm ci --ignore-scripts && npm ci --prefix web

      - name: Typecheck and build web UI
        run: |
          npm run typecheck:web
          npm run build:web

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        env:
          TOBI_NO_STATE_WRITE: '1'
        run: npx playwright test

      - name: Verify clean working tree after tests and build
        run: test -z "$(git status --porcelain)"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
